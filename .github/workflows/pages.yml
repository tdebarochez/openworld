# On every push to main: export the web build with Godot and publish it to the gh-pages branch
# (GitHub Pages serves that branch). The web preset has thread support off, so it runs on Pages
# without the cross-origin isolation headers Pages can't send.
name: Web build to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # push to gh-pages

concurrency:
  group: gh-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Godot and its web export templates (only those are kept: the full .tpz is 1.3 GB).
      - uses: actions/cache@v6
        id: godot
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot and the web export templates
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz 'templates/web_*' 'templates/version.txt' -d /tmp
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          mv /tmp/templates/* "$dest/"

      - name: Import assets
        run: ~/godot/godot --headless --path . --import

      - name: Export the web build
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.pck
          touch build/web/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true  # gh-pages keeps only the latest build, not a history of 40 MB builds
